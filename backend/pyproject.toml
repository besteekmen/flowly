[project]
name = "flowly-backend"
version = "0.1.0"
description = "Flowly homework API with SQLite storage"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic[email]>=2.9,<3",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "openapi-spec-validator>=0.7,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
